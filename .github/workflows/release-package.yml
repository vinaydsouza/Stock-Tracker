name: Build Stock Tracker package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build distribution
        run: ./gradlew :app:distZip

      - name: Upload package to workflow
        uses: actions/upload-artifact@v4
        with:
          name: stock-tracker
          path: app/build/distributions/stock-tracker.zip
          if-no-files-found: error

      - name: Attach package to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" app/build/distributions/stock-tracker.zip --clobber
