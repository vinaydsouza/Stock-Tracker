name: Build Stock Tracker package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Install Debian packaging tools
        run: sudo apt-get update && sudo apt-get install --yes fakeroot

      - name: Build application distributions
        run: ./gradlew :app:distZip :app:installDist

      - name: Build Ubuntu package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '1.0.0' }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Release tag must contain a numeric version, optionally prefixed with v."
            exit 1
          fi
          jpackage \
            --type deb \
            --name "Stock Tracker" \
            --app-version "$version" \
            --vendor "Stock Tracker" \
            --description "A lightweight desktop stock watchlist and quote tracker." \
            --linux-deb-maintainer "vinay-dsouza@users.noreply.github.com" \
            --input app/build/install/stock-tracker/lib \
            --main-jar app.jar \
            --main-class stock.tracker.App \
            --dest app/build/distributions \
            --linux-package-name stock-tracker \
            --linux-app-category Finance \
            --linux-menu-group Finance \
            --linux-shortcut

      - name: Upload packages to workflow
        uses: actions/upload-artifact@v4
        with:
          name: stock-tracker
          path: |
            app/build/distributions/stock-tracker.zip
            app/build/distributions/*.deb
          if-no-files-found: error

      - name: Attach packages to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" app/build/distributions/stock-tracker.zip app/build/distributions/*.deb --clobber
